#aksauth
variables:
  - name: USER_ASSIGNED_CLIENT_ID
    value: 'a699272b-3aa5-439b-baae-6abec0abbcd6'
  - name: SERVICE_ACCOUNT_NAME
    value: 'kedasvc'
  - name: NAMESPACE_NAME
    value: 'keda113'
  - name: TENANT_ID
    value: '17a09c66-f406-4897-8b24-51f5313623dc'

parameters:
  - name: deployScaledObject
    type: boolean
    default: true
  - name: deploymyapp
    type: boolean
    default: true
  - name: deployhelm
    type: boolean
    default: true 
  - name: deploynamespace
    type: boolean
    default: true
  - name: deployserviceaccount 
    type: boolean
    default: true 
  - name: deploykeda
    type: boolean
    default: true
  - name: deployingress
    type: boolean
    default: false
  - name: deployconfigmap
    type: boolean
    default: true
  - name: deploynginxhelm
    type: boolean
    default: true


trigger: none
pr: none
pool:
  vmImage: ubuntu-latest

jobs: 

  - job: aksdeploy
    displayName: AKSdepoy
    timeoutInMinutes: 10 # how long to run the job before automatically cancelling
    cancelTimeoutInMinutes: 2 # how much time to give 'run always even if cancelled tasks' before stopping them
    steps:
      - task: KubeloginInstaller@0
        inputs:
          kubeloginVersion: 'latest'
        displayName: installkubelogin
      
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
           
            az aks get-credentials --resource-group testrg --name aks-cluster-1 
            kubelogin convert-kubeconfig -l azurecli
          
        
        displayName: 'Get AKS credentials'


      - script: |
              sed -i "s|#{SERVICE_ACCOUNT_NAME}#|$(SERVICE_ACCOUNT_NAME)|g" ./aksyamls/svc.yml
              sed -i "s|#{NAMESPACE_NAME}#|$(NAMESPACE_NAME)|g" ./aksyamls/namespace.yml
              sed -i "s|#{USER_ASSIGNED_CLIENT_ID}#|$(USER_ASSIGNED_CLIENT_ID)|g" ./aksyamls/svc.yml
        displayName: 'Replace variables Name in Manifest'

      - task: AzureCLI@2
        condition:  ${{ eq(parameters.deploynamespace, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl get pods 
            kubectl apply -f ./aksyamls/namespace.yml
            
        displayName: 'List AKS resources & create namespace'

      - task: AzureCLI@2
        condition:  ${{ eq(parameters.deployserviceaccount, true) }}

        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f ./aksyamls/svc.yml -n $(NAMESPACE_NAME)
            
        displayName: 'Create Service Account'

      - task: helmInstaller@1
        condition:  ${{ eq(parameters.deployhelm, true) }}
        inputs:
          helmVersionToInstall: 'latest'
        displayName: 'Install Helm'

      - task: AzureCLI@2
        condition: ${{ eq(parameters.deployhelm, true) }}
        displayName: 'Add KEDA Helm Repo'
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            helm repo add kedacore https://kedacore.github.io/charts
            helm repo update
            helm repo list
            
        
      - task: AzureCLI@2
        condition: ${{ eq(parameters.deployhelm, true) }}
        displayName: 'Install KEDA'
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            helm upgrade --install keda kedacore/keda --namespace keda113 \
            --set serviceAccount.create=false \
            --set serviceAccount.operator.name=$(SERVICE_ACCOUNT_NAME) \
            --set podIdentity.azureWorkload.enabled=true \
            --set podIdentity.azureWorkload.clientId=$USER_ASSIGNED_CLIENT_ID \
            --set podIdentity.azureWorkload.tenantId=$TENANT_ID
          


      - task: AzureCLI@2
        condition: ${{ eq(parameters.deploymyapp, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f ./aksyamls/myapp.yml -n $(NAMESPACE_NAME)
            
            
           
            
        displayName: 'apply myapp manifest'

        
      - task: AzureCLI@2
        condition: ${{ eq(parameters.deployscaledobject, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f ./aksyamls/scaledobj.yml -n $(NAMESPACE_NAME)

        displayName: 'apply scaled object manifest'

    

      - task: AzureCLI@2
        condition: ${{ eq(parameters.deployconfigmap, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f ./aksyamls/configmap.yml -n kube-system

      
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          condition: ${{ eq(parameters.deploynginxhelm, true) }}
          inlineScript: |
            
            kubectl apply -f ./aksyamls/ingressnamespace.yml
            
        displayName: 'create ingress namespace'
      
      - task: AzureCLI@2
        condition: ${{ eq(parameters.deploynginxhelm, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update

            
        displayName: 'helm repo add ingress-nginx' 

      - task: AzureCLI@2
        condition: ${{ eq(parameters.deploynginxhelm, true) }}  
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update

            helm upgrade --install nginx-ingress ingress-nginx/ingress-nginx \
              --namespace ingress \
              --set controller.publishService.enabled=true \
              --set controller.metrics.enabled=true \
              --set controller.podAnnotations."prometheus\.io/scrape"="true" \
              --set controller.podAnnotations."prometheus\.io/port"="10254"
        displayName: 'Install NGINX ingress controller via Helm'


      - task: AzureCLI@2
        condition: ${{ eq(parameters.deployingress, true) }}
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f ./aksyamls/ingress2.yml -n $(NAMESPACE_NAME)
            
        displayName: 'apply ingress manifest'