#aksauth
variables:
  - name: USER_ASSIGNED_CLIENT_ID
    value: 'a699272b-3aa5-439b-baae-6abec0abbcd6'
  - name: SERVICE_ACCOUNT_NAME
    value: 'kedasvc'
  - name: SERVICE_ACCOUNT_NAMESPACE
    value: 'keda112'

trigger: none
pr: none
pool:
  vmImage: ubuntu-latest

jobs: 

  - job: aksdeploy
    displayName: AKSdepoy
    timeoutInMinutes: 3 # how long to run the job before automatically cancelling
    cancelTimeoutInMinutes: 2 # how much time to give 'run always even if cancelled tasks' before stopping them
    steps:
      - task: KubeloginInstaller@0
        inputs:
          kubeloginVersion: 'latest'
        displayName: installkubelogin
      
      - task: AzureCLI@2
        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
           
            az aks get-credentials --resource-group testrg --name aks-cluster-1 
            kubelogin convert-kubeconfig -l azurecli
          
        
        displayName: 'Get AKS credentials'
      - task: AzureCLI@2

        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl get pods 
            kubectl create namespace keda112
            
        displayName: 'List AKS resources & create namespace'

      - task: AzureCLI@2

        inputs:
          azureSubscription: 'aks-svc-june22'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'
          inlineScript: |
            
            kubectl apply -f $(Pipeline.Workspace)/aksyamls/svc.yml
            
        displayName: 'Create Service Account'

        
